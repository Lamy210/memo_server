name: Generate Cargo Lock

on:
  pull_request:
    paths:
      - "backend/Cargo.toml"
      - ".github/workflows/cargo-lock-refresh.yml"

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/mongodb-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Rust toolchain
        run: rustup show

      - name: Resolve dependency graph
        working-directory: backend
        run: cargo check

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v7
        with:
          name: mongodb-cargo-lock-${{ github.run_id }}
          path: backend/Cargo.lock
          if-no-files-found: error
          retention-days: 1
