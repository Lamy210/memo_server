name: Generate Cargo Lock

on:
  pull_request:
    paths:
      - "backend/Cargo.toml"
      - ".github/workflows/cargo-lock-refresh.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/mongodb-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v7
        with:
          ref: feat/mongodb-foundation

      - name: Configure Rust toolchain
        run: rustup show

      - name: Resolve dependency graph
        working-directory: backend
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock

          if git diff --cached --quiet; then
            echo "Cargo.lock is already up to date"
            exit 0
          fi

          git commit -m "build: refresh Cargo.lock for MongoDB driver"
          git push origin HEAD:feat/mongodb-foundation
