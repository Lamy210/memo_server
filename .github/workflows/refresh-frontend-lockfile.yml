name: Refresh frontend lockfile

on:
  push:
    branches:
      - ci/lighthouse-baseline

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Resolve frontend lockfile
        run: pnpm --dir frontend install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh frontend pnpm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
