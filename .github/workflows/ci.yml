name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        shell: bash
        run: |
          bash scripts/ci-retry.sh 3 5 sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
        working-directory: .

      - name: Configure Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Configuration contract
        run: cargo test --locked --test config

      - name: Check
        run: cargo check --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name memo-mongodb-ci -p 27017:27017 \
            mongo:8.0.32 --replSet rs0 --bind_ip_all

          ready=0
          for _ in $(seq 1 60); do
            if docker exec memo-mongodb-ci mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            docker logs memo-mongodb-ci >&2 || true
            exit 1
          fi

          docker exec memo-mongodb-ci mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

          primary=0
          for _ in $(seq 1 60); do
            state="$(docker exec memo-mongodb-ci mongosh --quiet \
              --eval 'try { rs.status().myState } catch (error) { 0 }' | tail -n 1)"
            if [[ "$state" == "1" ]]; then
              primary=1
              break
            fi
            sleep 2
          done

          if [[ "$primary" -ne 1 ]]; then
            docker exec memo-mongodb-ci mongosh --quiet --eval 'rs.status()' >&2 || true
            docker logs memo-mongodb-ci >&2 || true
            exit 1
          fi

      - name: MongoDB transactional integration
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=10000
        run: |
          cargo test --locked mongodb_replica_set_preserves_atomic_outbox_and_tenant_scope \
            -- --ignored --nocapture

      - name: Stop MongoDB replica set
        if: always()
        run: docker rm -f memo-mongodb-ci >/dev/null 2>&1 || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          bash ../scripts/ci-retry.sh 3 5 corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Svelte checks
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: Build
        run: pnpm build

  frontend-e2e:
    name: Frontend browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          bash ../scripts/ci-retry.sh 3 5 corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Discover browser E2E tests
        run: pnpm exec playwright test --list

      - name: Browser E2E
        shell: bash
        run: |
          set -euo pipefail

          pnpm build

          python3 ../scripts/ui-fixture-server.py --port 18080 >"$RUNNER_TEMP/e2e-fixture.log" 2>&1 &
          fixture_pid=$!

          BACKEND_URL=http://127.0.0.1:18080 \
            pnpm preview --host 127.0.0.1 --port 4173 --strictPort >"$RUNNER_TEMP/e2e-preview.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            kill "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          fixture_ready=0
          frontend_ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              fixture_ready=1
            fi
            if curl -fsS http://127.0.0.1:4173/memos >/dev/null; then
              frontend_ready=1
            fi
            if [[ "$fixture_ready" -eq 1 && "$frontend_ready" -eq 1 ]]; then
              break
            fi
            sleep 1
          done

          if [[ "$fixture_ready" -ne 1 || "$frontend_ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/e2e-fixture.log" >&2 || true
            cat "$RUNNER_TEMP/e2e-preview.log" >&2 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4173/api/v1/memos \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert len(data) == 3'

          pnpm test:e2e

      - name: Collect browser E2E logs
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/server-logs
          cp "$RUNNER_TEMP"/e2e-*.log test-results/server-logs/ 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend

  smoke:
    name: Full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
      - frontend-e2e
      - containers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Compose smoke test
        run: bash scripts/smoke.sh
