name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
        working-directory: .

      - name: Configure Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Refresh Scylla lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/upgrade-scylla-driver'
        run: cargo update -p scylla --precise 1.9.0

      - name: Commit refreshed Cargo.lock
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/upgrade-scylla-driver'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Scylla driver"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Configuration contract
        run: cargo test --locked --test config

      - name: Check
        run: cargo check --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Svelte checks
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: Build
        run: pnpm build

  containers:
    name: Container definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend

  smoke:
    name: Full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
      - containers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Compose smoke test
        run: bash scripts/smoke.sh
