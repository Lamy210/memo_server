name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          bash scripts/ci-retry.sh 3 5 corepack prepare pnpm@9.15.9 --activate

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run Lighthouse CI
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/ui-fixture-server.py --port 18080 >"$RUNNER_TEMP/lighthouse-fixture.log" 2>&1 &
          fixture_pid=$!

          (
            cd frontend
            BACKEND_URL=http://127.0.0.1:18080 \
            DEVELOPMENT_USER_ID=12345678-1234-1234-1234-123456789012 \
              pnpm preview --host 127.0.0.1 --port 4173
          ) >"$RUNNER_TEMP/lighthouse-preview.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            kill "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          fixture_ready=0
          frontend_ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              fixture_ready=1
            fi
            if curl -fsS http://127.0.0.1:4173/memos >/dev/null; then
              frontend_ready=1
            fi
            if [[ "$fixture_ready" -eq 1 && "$frontend_ready" -eq 1 ]]; then
              break
            fi
            sleep 1
          done

          if [[ "$fixture_ready" -ne 1 || "$frontend_ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/lighthouse-fixture.log" >&2 || true
            cat "$RUNNER_TEMP/lighthouse-preview.log" >&2 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4173/api/v1/memos \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert len(data) == 3'

          (
            cd frontend
            pnpm test:lighthouse
          ) 2>&1 | tee "$RUNNER_TEMP/lighthouse.log"

      - name: Summarize Lighthouse results
        if: success()
        run: |
          mkdir -p artifacts
          python3 scripts/lighthouse-summary.py \
            frontend/.lighthouseci-reports/manifest.json \
            artifacts/lighthouse-summary.md
          cat artifacts/lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Lighthouse logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          cp "$RUNNER_TEMP"/lighthouse*.log artifacts/logs/ 2>/dev/null || true

      - name: Upload Lighthouse artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts
            frontend/.lighthouseci-reports
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Link Lighthouse artifact
        if: always() && steps.upload.outputs.artifact-url != ''
        run: |
          {
            echo
            echo "[Open Lighthouse artifact](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
