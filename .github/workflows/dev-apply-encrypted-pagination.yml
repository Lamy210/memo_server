name: Apply encrypted MongoDB pagination patch

on:
  push:
    branches:
      - feat/memo-list-pagination-v1
    paths:
      - .github/workflows/dev-apply-encrypted-pagination.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/memo-list-pagination-v1
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/src/infrastructure/persistence/mongodb.rs")
          source = path.read_text()

          old_index = '.keys(doc! { "owner_partition": 1 })'
          new_index = '.keys(doc! { "owner_partition": 1, "_id": -1 })'
          if source.count(old_index) != 1:
              raise SystemExit("encrypted owner index expression did not match exactly once")
          source = source.replace(old_index, new_index, 1)

          marker = "    async fn find_many_envelopes_by_ids(\n"
          if source.count(marker) != 1:
              raise SystemExit("encrypted find-many marker did not match exactly once")
          method = (
              "    async fn page_envelopes_by_owner(\n"
              "        &self,\n"
              "        owner_partition: Uuid,\n"
              "        after: Option<Uuid>,\n"
              "        limit: usize,\n"
              "    ) -> AppResult<Vec<HighEncryptedMemoEnvelope>> {\n"
              "        let limit = i64::try_from(limit).map_err(|_| {\n"
              "            AppError::DatabaseError(\"MongoDB encrypted memo page size is too large\".into())\n"
              "        })?;\n"
              "        let mut filter = doc! { \"owner_partition\": owner_partition.to_string() };\n"
              "        if let Some(after) = after {\n"
              "            filter.insert(\"_id\", doc! { \"$lt\": after.to_string() });\n"
              "        }\n"
              "\n"
              "        let documents: Vec<EncryptedMemoDocument> = self\n"
              "            .encrypted_memos\n"
              "            .find(filter)\n"
              "            .sort(doc! { \"_id\": -1 })\n"
              "            .limit(limit)\n"
              "            .await\n"
              "            .map_err(|error| mongo_error(\"page encrypted MongoDB memos\", error))?\n"
              "            .try_collect()\n"
              "            .await\n"
              "            .map_err(|error| mongo_error(\"read encrypted MongoDB memo page\", error))?;\n"
              "\n"
              "        documents\n"
              "            .into_iter()\n"
              "            .map(EncryptedMemoDocument::try_into_envelope)\n"
              "            .collect()\n"
              "    }\n"
              "\n"
          )
          source = source.replace(marker, method + marker, 1)
          path.write_text(source)
          PY

          cd backend
          cargo fmt
          cd ..
          git diff --check

      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/infrastructure/persistence/mongodb.rs
          git rm .github/workflows/dev-apply-encrypted-pagination.yml
          git diff --cached --check
          git commit -m "feat: paginate encrypted MongoDB memos"
          git push origin HEAD:feat/memo-list-pagination-v1
