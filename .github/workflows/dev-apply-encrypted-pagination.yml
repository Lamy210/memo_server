name: Apply encrypted MongoDB pagination patch

on:
  push:
    branches:
      - feat/memo-list-pagination-v1
    paths:
      - .github/workflows/dev-apply-encrypted-pagination.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/memo-list-pagination-v1
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/src/infrastructure/persistence/mongodb.rs")
          source = path.read_text()

          old_index = '''    async fn ensure_encrypted_memo_indexes(&self) -> AppResult<()> {
              self.encrypted_memos
                  .create_index(
                      IndexModel::builder()
                          .keys(doc! { "owner_partition": 1 })
                          .build(),
                  )
                  .await
                  .map_err(|error| mongo_error("create MongoDB encrypted memo indexes", error))?;
              Ok(())
          }
          '''
          new_index = '''    async fn ensure_encrypted_memo_indexes(&self) -> AppResult<()> {
              self.encrypted_memos
                  .create_index(
                      IndexModel::builder()
                          .keys(doc! { "owner_partition": 1, "_id": -1 })
                          .build(),
                  )
                  .await
                  .map_err(|error| {
                      mongo_error("create MongoDB encrypted memo pagination index", error)
                  })?;
              Ok(())
          }
          '''
          if source.count(old_index) != 1:
              raise SystemExit("encrypted memo index block did not match exactly once")
          source = source.replace(old_index, new_index, 1)

          anchor = '''    async fn find_all_envelopes_by_owner(
              &self,
              owner_partition: Uuid,
          ) -> AppResult<Vec<HighEncryptedMemoEnvelope>> {
              let documents: Vec<EncryptedMemoDocument> = self
                  .encrypted_memos
                  .find(doc! { "owner_partition": owner_partition.to_string() })
                  .await
                  .map_err(|error| mongo_error("find encrypted MongoDB memos", error))?
                  .try_collect()
                  .await
                  .map_err(|error| mongo_error("read encrypted MongoDB memo cursor", error))?;

              documents
                  .into_iter()
                  .map(EncryptedMemoDocument::try_into_envelope)
                  .collect()
          }
          '''
          replacement = anchor + '''
              async fn page_envelopes_by_owner(
                  &self,
                  owner_partition: Uuid,
                  after: Option<Uuid>,
                  limit: usize,
              ) -> AppResult<Vec<HighEncryptedMemoEnvelope>> {
                  let limit = i64::try_from(limit).map_err(|_| {
                      AppError::DatabaseError("MongoDB encrypted memo page size is too large".into())
                  })?;
                  let mut filter = doc! { "owner_partition": owner_partition.to_string() };
                  if let Some(after) = after {
                      filter.insert("_id", doc! { "$lt": after.to_string() });
                  }

                  let documents: Vec<EncryptedMemoDocument> = self
                      .encrypted_memos
                      .find(filter)
                      .sort(doc! { "_id": -1 })
                      .limit(limit)
                      .await
                      .map_err(|error| mongo_error("page encrypted MongoDB memos", error))?
                      .try_collect()
                      .await
                      .map_err(|error| mongo_error("read encrypted MongoDB memo page", error))?;

                  documents
                      .into_iter()
                      .map(EncryptedMemoDocument::try_into_envelope)
                      .collect()
              }
          '''
          if source.count(anchor) != 1:
              raise SystemExit("encrypted authoritative store anchor did not match exactly once")
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          PY

          cd backend
          cargo fmt
          cd ..
          git diff --check

      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/infrastructure/persistence/mongodb.rs
          git rm .github/workflows/dev-apply-encrypted-pagination.yml
          git diff --cached --check
          git commit -m "feat: paginate encrypted MongoDB memos"
          git push origin HEAD:feat/memo-list-pagination-v1
