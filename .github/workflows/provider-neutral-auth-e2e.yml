name: Provider-neutral auth E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: provider-neutral-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-e2e:
    name: Provider-neutral browser auth E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          bash ../scripts/ci-retry.sh 3 5 corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provider-neutral browser auth E2E
        shell: bash
        run: |
          set -euo pipefail

          pnpm build

          python3 ../scripts/identity-fixture-server.py \
            --port 19090 \
            --client-id memo-web \
            --client-secret fixture-secret \
            --redirect-uri http://127.0.0.1:4173/auth/callback \
            >"$RUNNER_TEMP/identity-fixture.log" 2>&1 &
          identity_pid=$!

          python3 ../scripts/ui-fixture-server.py \
            --port 18080 \
            --require-identity-encoding \
            --expected-bearer-token access-fixture-1 \
            --expected-bearer-token access-fixture-2 \
            >"$RUNNER_TEMP/memo-fixture.log" 2>&1 &
          memo_pid=$!

          session_key="$(python3 -c 'import base64; print(base64.b64encode(bytes([42]) * 32).decode())')"
          BACKEND_URL=http://127.0.0.1:18080 \
          IDENTITY_ISSUER=http://127.0.0.1:19090 \
          IDENTITY_CLIENT_ID=memo-web \
          IDENTITY_CLIENT_SECRET=fixture-secret \
          IDENTITY_SESSION_KEY="$session_key" \
            pnpm preview --host 127.0.0.1 --port 4173 --strictPort \
            >"$RUNNER_TEMP/auth-preview.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            kill "$memo_pid" 2>/dev/null || true
            kill "$identity_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19090/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:18080/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:4173/auth/session >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/identity-fixture.log" >&2 || true
            cat "$RUNNER_TEMP/memo-fixture.log" >&2 || true
            cat "$RUNNER_TEMP/auth-preview.log" >&2 || true
            exit 1
          fi

          IDENTITY_E2E=1 pnpm exec playwright test tests/e2e/auth-session.spec.ts

      - name: Collect auth E2E logs
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/auth-server-logs
          cp "$RUNNER_TEMP"/identity-fixture.log test-results/auth-server-logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/memo-fixture.log test-results/auth-server-logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/auth-preview.log test-results/auth-server-logs/ 2>/dev/null || true

      - name: Upload auth Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-neutral-auth-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
