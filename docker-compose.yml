services:
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8080
      DEVELOPMENT_USER_ID: 12345678-1234-1234-1234-123456789012
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memo-network

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_cache:/app/target
      - cargo_registry:/usr/local/cargo/registry
    ports:
      - "8083:8080"
    environment:
      RUST_LOG: info
      SCYLLA_URI: scylla:9042
      REDIS_URL: redis://valkey:6379
      SEARCH_BACKEND: manticore
      MANTICORE_URL: http://manticore:9308
      PORT: "8080"
      AUTH_MODE: development
    command: ["cargo", "run", "--locked"]
    depends_on:
      scylla:
        condition: service_healthy
      valkey:
        condition: service_healthy
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - memo-network

  scylla:
    image: scylladb/scylla:5.2
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    command: --developer-mode 1 --overprovisioned 1 --smp 1 --memory 2G
    healthcheck:
      test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -q '^UN'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - memo-network

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - memo-network

  manticore:
    image: manticoresearch/manticore:29.9.0
    ports:
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9306 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - memo-network

volumes:
  frontend_node_modules:
  backend_cache:
  cargo_registry:
  scylla_data:
  manticore_data:

networks:
  memo-network:
    driver: bridge
