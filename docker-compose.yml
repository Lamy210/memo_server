services:
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8080
      DEVELOPMENT_USER_ID: 12345678-1234-1234-1234-123456789012
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memo-network

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_cache:/app/target
      - cargo_registry:/usr/local/cargo/registry
    ports:
      - "8083:8080"
    environment:
      RUST_LOG: info
      SCYLLA_URI: scylla:9042
      REDIS_URL: redis://valkey:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: "8080"
      AUTH_MODE: development
    command: ["cargo", "run", "--locked"]
    depends_on:
      scylla:
        condition: service_healthy
      valkey:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - memo-network

  scylla:
    image: scylladb/scylla:5.2
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    command: --developer-mode 1 --overprovisioned 1 --smp 1 --memory 2G
    healthcheck:
      test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -q '^UN'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - memo-network

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - memo-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - memo-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    profiles: ["observability"]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - memo-network

volumes:
  frontend_node_modules:
  backend_cache:
  cargo_registry:
  scylla_data:
  valkey_data:
  elasticsearch_data:

networks:
  memo-network:
    driver: bridge
