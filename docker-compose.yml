services:
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8080
      DEVELOPMENT_USER_ID: 12345678-1234-1234-1234-123456789012
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memo-network

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_cache:/app/target
      - cargo_registry:/usr/local/cargo/registry
    ports:
      - "8083:8080"
    environment:
      RUST_LOG: info
      AUTHORITATIVE_BACKEND: mongodb
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: memo_app
      REDIS_URL: redis://valkey:6379
      SEARCH_BACKEND: manticore
      MANTICORE_URL: http://manticore:9308
      PORT: "8080"
      AUTH_MODE: development
    command: ["cargo", "run", "--locked"]
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - memo-network

  mongodb:
    image: mongo:8.0.32-noble
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "128"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try {
            if (rs.status().myState === 1) { quit(0); }
            quit(1);
          } catch (error) {
            try {
              rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]});
            } catch (ignored) {}
            quit(1);
          }'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks:
      - memo-network

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - memo-network

  manticore:
    image: manticoresearch/manticore:29.9.0
    ports:
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9306 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - memo-network

volumes:
  frontend_node_modules:
  backend_cache:
  cargo_registry:
  mongodb_data:
  manticore_data:

networks:
  memo-network:
    driver: bridge
