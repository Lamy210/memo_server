version: 1
last_reviewed: "2026-09-23"

policy:
  default_security_profile: HIGH
  plaintext_policy: deny_by_default
  suite_lifecycle:
    - ACTIVE
    - READ_ONLY
    - DEPRECATED
    - REJECTED
  implementation_status:
    - PLANNED
    - DEPLOYED
    - RETIRED
  runtime_eligibility:
    lifecycle: ACTIVE
    implementation_status: DEPLOYED
  new_writes_require:
    lifecycle: ACTIVE
    implementation_status: DEPLOYED
  unknown_suite_behavior: reject
  rejected_suite_behavior: reject

assets:
  - asset: memo_payload_high
    classification: confidential_user_content
    profile: HIGH
    target:
      encryption: AES-256-GCM
      key_size_bits: 256
      nonce_size_bits: 96
      tag_size_bits: 128
      key_scope: per_memo_version
      aad:
        - owner_partition
        - memo_id
        - version
        - schema_version
        - crypto_suite_id
      suite_id: MEMO-HIGH-1
    current:
      state: plaintext_authoritative_storage_migration
      authoritative_store: MongoDB
      legacy_authoritative_store: ScyllaDB
      selection: AUTHORITATIVE_BACKEND
      atomic_outbox_on_mongodb: true
      crypto_foundation:
        envelope_contract: implemented
        payload_codec: implemented
        aead_adapter: staged
        key_wrapping_provider: not_configured
        runtime_eligible: false
    migration_status: in_progress
    owner: memo-crypto

  - asset: memo_payload_vault
    classification: highest_confidentiality_user_content
    profile: VAULT
    target:
      encryption: AES-256-GCM
      key_size_bits: 256
      nonce_size_bits: 96
      tag_size_bits: 128
      key_scope: per_memo_version
      root_key: client_controlled_vrk
      server_plaintext_access: false
      suite_id: VAULT-1
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-crypto

  - asset: high_dek_generation
    classification: key_management
    profile: HIGH
    target:
      generation: CSPRNG
      key_size_bits: 256
      reuse: forbidden
    current:
      state: provider_boundary_staged
      plaintext_key_zeroizing: true
      production_provider: not_implemented
      runtime_eligible: false
    migration_status: in_progress
    owner: memo-crypto

  - asset: vault_key_derivation
    classification: key_management
    profile: VAULT
    target:
      kdf: HKDF-SHA-384
      source:
        - webauthn_prf_credential_bound_when_supported
        - independent_device_secret_for_device_bound_wrapper
      webauthn_prf_capability_detection: required
      webauthn_prf_device_binding_assumption: forbidden
      prf_output_server_exposure: forbidden
      domain_separation: required
      passkey_private_key_as_content_key: forbidden
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-crypto

  - asset: high_search_tokens
    classification: sensitive_derived_metadata
    profile: HIGH
    target:
      construction: HMAC-SHA-384
      key_scope: per_user
      plaintext_index: forbidden
      server_index: Manticore
      suite_id: SEARCH-HIGH-1
    leakage:
      - equality
      - frequency
      - document_relationship
      - access_pattern
      - query_pattern
    current:
      state: plaintext_search_projection_migration
      server_index: Manticore
      legacy_server_index: Elasticsearch
      selection: SEARCH_BACKEND
      blind_token_deriver: staged
      analyzer:
        implementation: icu4x_dictionary
        implementation_version: "2.3.0"
        analysis_version: "icu4x-2.3.0-uax29-17-nfkc-fold-dict-v1"
        unicode_word_break: "17.0"
        normalization: nfkc_casefold_nfkc
        content_segmentation: dictionary_word_like
        plaintext_term_pre_deduplication: true
        application_work_budget:
          required: true
          document_unique_terms: caller_configured
          query_unique_terms: caller_configured
          normalized_term_bytes: caller_configured
          fail_before_crypto: true
          production_values: pending_corpus_validation
        tag_semantics: normalized_exact_term
        dependency_versions_exact_pinned: true
        synthetic_conformance_corpus:
          version: v1
          path: backend/testdata/high_search_analysis_corpus_v1.json
          unit_test_gate: true
          user_data: forbidden
        representative_corpus_validation: pending
        runtime_wired: false
      runtime_configuration:
        mode_default: disabled
        explicit_enable_value: aws-kms
        aws_kms_build_feature_required: aws-kms-search
        build_feature_mismatch_behavior: fail_closed
        manticore_required_when_enabled: true
        pinned_kms_key_arn_required: true
        aws_region_required_and_arn_matched: true
        provider_seed_version_required: true
        cache_ttl_required_positive: true
        cache_max_entries_required_positive: true
        cache_sweep_required_positive: true
        analysis_document_term_budget_required_positive: true
        analysis_query_term_budget_required_positive: true
        analysis_term_byte_budget_required_positive: true
        production_defaults: forbidden
        startup_provider_wiring: staged
        aws_config_version: "1.12.0"
        aws_region_source: explicit_validated_config
        aws_credentials_source: standard_provider_chain
        aws_client_construction: once_per_application_startup
        aws_kms_startup_preflight: DescribeKey
        aws_kms_startup_required_properties:
          - pinned_arn_match
          - enabled
          - key_state_enabled
          - key_spec_hmac_384
          - key_usage_generate_verify_mac
          - mac_algorithm_hmac_sha_384
        aws_kms_required_permissions:
          - kms:DescribeKey
          - kms:GenerateMac
        cache_sweeper_lifetime: application_owned
        disabled_mode_aws_config_load: forbidden
        request_path_wiring: false
      runtime_composition:
        stack_factory: staged
        managed_prf_client_injection: required_when_enabled
        managed_prf_client_binding: provider_and_immutable_key_reference
        config_client_key_identity_match: fail_closed
        analyzer: icu4x_dictionary
        owner_key_derivation: hkdf_sha384
        derived_key_cache: bounded
        protected_projection: manticore
        startup_composed: true_when_explicitly_enabled
        request_path_installed: false
      search_key_provider: boundary_staged
      owner_scoped_seed_provider: boundary_staged
      managed_prf_seed_adapter: staged
      managed_prf_algorithm: HMAC-SHA-384
      managed_prf_output_bytes: 48
      managed_prf_input: domain_versioned_seed_generation_owner_partition
      managed_prf_seed_version_contract: "prf384-v1:<provider-seed-version>"
      persisted_derived_key_version_contract: "hkdf384-v1:prf384-v1:<provider-seed-version>"
      managed_prf_plaintext_content_exposure: forbidden
      provider_specific_prf_client: aws_kms_staged
      aws_kms_sdk_version: "1.114.0"
      aws_kms_build_feature: aws-kms-search
      aws_kms_default_build_enabled: false
      aws_kms_operation: GenerateMac
      aws_kms_key_spec: HMAC_384
      aws_kms_mac_algorithm: HMAC_SHA_384
      aws_kms_key_identifier: pinned_key_arn_only
      aws_kms_alias_identifier: forbidden
      aws_kms_response_identity_check: required
      provider_key_binding: immutable_required
      per_user_hkdf_sha384: staged
      derived_key_version_contract: "hkdf384-v1:<seed-version>"
      key_resolution_batching: one_per_tokenization_operation
      derived_key_cache: staged
      cache_secret_scope: per_owner_derived_key_only
      cache_bounds: ttl_and_max_entries_required
      cache_ttl_semantics: reuse_ttl
      cache_expiry_sweep: explicit_boundary_staged
      cache_hard_residency_guarantee: not_claimed
      cache_rotation_invalidation: explicit
      cache_inflight_invalidation_fence: fail_closed_epoch
      cache_single_flight: not_implemented
      rotation_protocol:
        orchestration: staged
        offline_window_guard: required
        offline_window_permit: required_and_held_through_reindex_cleanup_and_cutover
        prepared_result: must_use_rotation_ready
        explicit_finish_after_cutover: required
        explicit_abort_cache_cleanup: supported
        boolean_freeze_assertion: forbidden
        cache_clear_before_reindex: true
        cache_clear_on_failure: true
        offline_window_recheck_after_reindex: permit_lease_revalidation
        traffic_resume_owned_by_operator: true
        concrete_maintenance_guard: not_implemented
      long_lived_search_root_process_exposure: forbidden
      production_search_key_provider: not_implemented
      protected_projection:
        adapter: staged
        table: memos_high_v1
        semantic_plaintext_fields: forbidden
        owner_scoped_delete: true
        analysis_version_required: true
        manticore_version: 29.9.0
        integration_gate: configured
        reindex_verification: staged
        reindex_write_freeze_required: true
      legacy_plaintext_projection_active: true
      runtime_eligible: false
    migration_status: in_progress
    owner: memo-search

  - asset: vault_search
    classification: highest_confidentiality_derived_metadata
    profile: VAULT
    target:
      location: client
      encrypted_at_rest: true
      server_private_content_index: forbidden
      suite_id: null
      suite_selection: pending_client_index_design
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-search

  - asset: access_token_signature
    classification: authentication
    profile: HIGH
    target:
      algorithm: ES384
      suite_id: AUTH-1
    current:
      algorithm: RS256
      suite_id: AUTH-RS256-LEGACY
      state: active_legacy
    migration_status: planned
    owner: memo-auth

  - asset: passkey_authentication
    classification: authentication
    target:
      standard: WebAuthn-Level-3
      user_verification: required
      synced_passkeys_for_standard_users: allowed
      device_bound_authenticator_for_admin_or_high_assurance: preferred
    current:
      state: not_implemented
    migration_status: planned
    owner: memo-auth

  - asset: dpop
    classification: authentication_token_binding
    target:
      standard: DPoP
      proof_key_location: BFF
      replay_detection: required
    current:
      state: not_implemented
    migration_status: planned
    owner: memo-auth

  - asset: pq_key_establishment
    classification: transport
    target:
      algorithm: X25519MLKEM768
      mode: standardized_hybrid
      custom_protocol: forbidden
      suite_id: TLS-PQ-1
    current:
      state: environment_dependent
    migration_status: optional_staged
    owner: platform-security

  - asset: pq_long_lived_signature
    classification: long_lived_trust
    target:
      algorithm: ML-DSA-87
      primary_uses:
        - audit_checkpoint
        - backup_manifest
        - release_signing
        - security_configuration
      suite_id: AUTH-PQ-1
    current:
      state: not_implemented
    migration_status: optional_staged
    owner: platform-security

  - asset: audit_hash_chain
    classification: security_audit
    target:
      hash: SHA-384
      previous_hash_binding: required
      checkpoint_signature: ML-DSA-87
    current:
      state: not_implemented
    migration_status: planned
    owner: audit-security

  - asset: backup_encryption
    classification: backup
    target:
      key_scope: separate_from_live_data
      encrypted: true
      immutable: true
      versioned: true
      plaintext_vault_material: forbidden
    current:
      state: not_implemented
    migration_status: planned
    owner: platform-security

