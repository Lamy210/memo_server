version: 1
last_reviewed: "2026-09-21"

policy:
  default_security_profile: HIGH
  plaintext_policy: deny_by_default
  suite_lifecycle:
    - ACTIVE
    - READ_ONLY
    - DEPRECATED
    - REJECTED
  implementation_status:
    - PLANNED
    - DEPLOYED
    - RETIRED
  runtime_eligibility:
    lifecycle: ACTIVE
    implementation_status: DEPLOYED
  new_writes_require:
    lifecycle: ACTIVE
    implementation_status: DEPLOYED
  unknown_suite_behavior: reject
  rejected_suite_behavior: reject

assets:
  - asset: memo_payload_high
    classification: confidential_user_content
    profile: HIGH
    target:
      encryption: AES-256-GCM
      key_size_bits: 256
      key_scope: per_memo_version
      aad:
        - owner_partition
        - memo_id
        - version
        - schema_version
        - crypto_suite_id
      suite_id: MEMO-HIGH-1
    current:
      state: legacy_plaintext_storage
      authoritative_store: ScyllaDB
    migration_status: planned
    owner: memo-crypto

  - asset: memo_payload_vault
    classification: highest_confidentiality_user_content
    profile: VAULT
    target:
      encryption: AES-256-GCM
      key_size_bits: 256
      key_scope: per_memo_version
      root_key: client_controlled_vrk
      server_plaintext_access: false
      suite_id: VAULT-1
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-crypto

  - asset: high_dek_derivation
    classification: key_management
    profile: HIGH
    target:
      generation: CSPRNG
      key_size_bits: 256
      reuse: forbidden
    current:
      state: not_implemented
    migration_status: planned
    owner: memo-crypto

  - asset: vault_key_derivation
    classification: key_management
    profile: VAULT
    target:
      kdf: HKDF-SHA-384
      domain_separation: required
      passkey_private_key_as_content_key: forbidden
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-crypto

  - asset: high_search_tokens
    classification: sensitive_derived_metadata
    profile: HIGH
    target:
      construction: HMAC-SHA-384
      key_scope: per_user
      plaintext_index: forbidden
      server_index: Manticore
      suite_id: SEARCH-HIGH-1
    leakage:
      - equality
      - frequency
      - document_relationship
      - access_pattern
      - query_pattern
    current:
      state: plaintext_search_projection
      server_index: Elasticsearch
    migration_status: planned
    owner: memo-search

  - asset: vault_search
    classification: highest_confidentiality_derived_metadata
    profile: VAULT
    target:
      location: client
      encrypted_at_rest: true
      server_private_content_index: forbidden
      suite_id: null
      suite_selection: pending_client_index_design
    current:
      state: not_implemented
    migration_status: planned
    owner: vault-search

  - asset: access_token_signature
    classification: authentication
    profile: HIGH
    target:
      algorithm: ES384
      suite_id: AUTH-1
    current:
      algorithm: RS256
      state: active_legacy
    migration_status: planned
    owner: memo-auth

  - asset: passkey_authentication
    classification: authentication
    target:
      standard: WebAuthn-Level-3
      user_verification: required
      synced_passkeys_for_standard_users: allowed
      device_bound_authenticator_for_admin_or_high_assurance: preferred
    current:
      state: not_implemented
    migration_status: planned
    owner: memo-auth

  - asset: dpop
    classification: authentication_token_binding
    target:
      standard: DPoP
      proof_key_location: BFF
      replay_detection: required
    current:
      state: not_implemented
    migration_status: planned
    owner: memo-auth

  - asset: pq_key_establishment
    classification: transport
    target:
      algorithm: X25519MLKEM768
      mode: standardized_hybrid
      custom_protocol: forbidden
      suite_id: TLS-PQ-1
    current:
      state: environment_dependent
    migration_status: optional_staged
    owner: platform-security

  - asset: pq_long_lived_signature
    classification: long_lived_trust
    target:
      algorithm: ML-DSA
      primary_uses:
        - audit_checkpoint
        - backup_manifest
        - release_signing
        - security_configuration
      suite_id: AUTH-PQ-1
    current:
      state: not_implemented
    migration_status: optional_staged
    owner: platform-security

  - asset: audit_hash_chain
    classification: security_audit
    target:
      hash: SHA-384
      previous_hash_binding: required
      checkpoint_signature: ML-DSA
    current:
      state: not_implemented
    migration_status: planned
    owner: audit-security

  - asset: backup_encryption
    classification: backup
    target:
      key_scope: separate_from_live_data
      encrypted: true
      immutable: true
      versioned: true
      plaintext_vault_material: forbidden
    current:
      state: not_implemented
    migration_status: planned
    owner: platform-security

suites:
  - suite_id: MEMO-HIGH-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: target
    encryption: AES-256-GCM
    kdf: HKDF-SHA-384
    mac: HMAC-SHA-384
    signature: null
    key_exchange: null
    notes:
      - "Runtime eligibility additionally requires implementation_status=DEPLOYED."
      - "Fresh CSPRNG DEK per memo version is mandatory."

  - suite_id: VAULT-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: target
    encryption: AES-256-GCM
    kdf: HKDF-SHA-384
    mac: HMAC-SHA-384
    signature: null
    key_exchange: null
    notes:
      - "VRK is client controlled."
      - "Backend must not possess memo DEK plaintext."

  - suite_id: SEARCH-HIGH-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: target
    encryption: null
    kdf: HKDF-SHA-384
    mac: HMAC-SHA-384
    signature: null
    key_exchange: null

  - suite_id: AUTH-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: target
    encryption: null
    kdf: null
    mac: null
    signature: ES384
    key_exchange: null

  - suite_id: TLS-PQ-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: optional_target
    encryption: TLS-1.3
    kdf: null
    mac: null
    signature: null
    key_exchange: X25519MLKEM768

  - suite_id: AUTH-PQ-1
    lifecycle: ACTIVE
    implementation_status: PLANNED
    intended_state: optional_target
    encryption: null
    kdf: null
    mac: null
    signature: ML-DSA
    key_exchange: null

standards:
  - name: WebAuthn Level 3
    status: W3C Recommendation
    date: "2026-08-25"
    reference: "https://www.w3.org/TR/2026/REC-webauthn-3-20260825/"

  - name: NIST FIPS 203
    primitive: ML-KEM
    status: Final
    reference: "https://csrc.nist.gov/pubs/fips/203/final"

  - name: NIST FIPS 204
    primitive: ML-DSA
    status: Final
    reference: "https://csrc.nist.gov/pubs/fips/204/final"

  - name: IETF RFC 10024
    primitive: X25519MLKEM768
    status: Standards Track
    date: "2026-08"
    reference: "https://www.rfc-editor.org/rfc/rfc10024.html"

  - name: CRYPTREC e-Government Recommended Ciphers List
    update: "ML-KEM added to key sharing"
    date: "2026-03-30"
    reference: "https://www.cryptrec.go.jp/whatsnew.html"

  - name: Cloudflare post-quantum origin TLS
    primitive: X25519MLKEM768
    status: supported
    reference: "https://developers.cloudflare.com/ssl/post-quantum-cryptography/pqc-to-origin/"
